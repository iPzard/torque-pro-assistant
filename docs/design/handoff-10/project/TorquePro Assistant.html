<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TorquePro Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Splash: rendered before React/Babel finish parsing so the first frame is branded. -->
<div id="splash" aria-hidden="false">
  <div class="splash-stage">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3" opacity=".22"/>
        <path d="M32 8 A24 24 0 0 1 56 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="splash-ring-arc"/>
        <path d="M32 18v14l9 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M52 18l-1 .8M14 18l1 .8M52 46l-1-.8M14 46l1-.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="splash-title">Torque<span>Pro</span> · Assistant</div>
    <div class="splash-ver">v0.4.2 · build 2026.04.14</div>

    <div class="splash-bar"><i id="splash-fill"/></div>
    <div class="splash-status">
      <span class="splash-dot"></span>
      <span id="splash-msg" class="splash-msg">Booting runtime…</span>
      <span id="splash-meta" class="splash-meta"></span>
    </div>

    <div class="splash-log" id="splash-log" aria-live="polite"></div>
  </div>
  <div class="splash-foot">
    Torque Pro Assistant boots locally — no telemetry. Press <span>Esc</span> if this hangs longer than 10 seconds.
  </div>
</div>

<script>
(function(){
  var stages = [
    { p: 12, msg: "Booting runtime\u2026",                meta: "react 18.3.1" },
    { p: 26, msg: "Loading vehicle profiles\u2026",       meta: "3 profiles \u00b7 1 active" },
    { p: 42, msg: "Indexing local session library\u2026", meta: "" },
    { p: 58, msg: "Scanning for paired adapters\u2026",   meta: "bluetooth" },
    { p: 74, msg: "Connecting to backend\u2026",          meta: "127.0.0.1:5000" },
    { p: 88, msg: "Hydrating UI\u2026",                   meta: "" },
    { p: 100,msg: "Ready",                                 meta: "" },
  ];
  var fill = document.getElementById('splash-fill');
  var msg  = document.getElementById('splash-msg');
  var meta = document.getElementById('splash-meta');
  var log  = document.getElementById('splash-log');
  var i = 0;
  function tick() {
    if (i >= stages.length) return;
    var s = stages[i];
    if (fill) fill.style.width = s.p + '%';
    if (msg)  msg.textContent = s.msg;
    if (meta) meta.textContent = s.meta;
    if (log && i > 0) {
      var line = document.createElement('div');
      var prev = stages[i-1];
      line.className = 'splash-log-line';
      line.innerHTML = '<span class="t">[' + String(prev.p).padStart(3,' ') + '%]</span> <span class="m">' + prev.msg.replace(/\u2026$/, '') + ' \u2713</span>';
      log.appendChild(line);
      while (log.children.length > 4) log.removeChild(log.firstChild);
    }
    i++;
    setTimeout(tick, 180 + Math.random() * 220);
  }
  tick();
  // React mount handler exposes this for graceful dismiss:
  window.__dismissSplash = function() {
    var el = document.getElementById('splash');
    if (!el) return;
    el.classList.add('splash-out');
    setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
  };
  // Replay support for the Tweaks panel.
  window.__showSplash = function() {
    var existing = document.getElementById('splash');
    if (existing) existing.parentNode.removeChild(existing);
    document.body.insertAdjacentHTML('afterbegin', document.getElementById('__splash-tmpl').innerHTML);
    i = 0;
    fill = document.getElementById('splash-fill');
    msg  = document.getElementById('splash-msg');
    meta = document.getElementById('splash-meta');
    log  = document.getElementById('splash-log');
    tick();
  };
})();
</script>
<template id="__splash-tmpl">
<div id="splash" aria-hidden="false">
  <div class="splash-stage">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3" opacity=".22"/>
        <path d="M32 8 A24 24 0 0 1 56 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="splash-ring-arc"/>
        <path d="M32 18v14l9 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="splash-title">Torque<span>Pro</span> · Assistant</div>
    <div class="splash-ver">v0.4.2 · build 2026.04.14</div>
    <div class="splash-bar"><i id="splash-fill"></i></div>
    <div class="splash-status"><span class="splash-dot"></span><span id="splash-msg" class="splash-msg">Booting runtime…</span><span id="splash-meta" class="splash-meta"></span></div>
    <div class="splash-log" id="splash-log"></div>
  </div>
  <div class="splash-foot">Torque Pro Assistant boots locally — no telemetry. Press <span>Esc</span> if this hangs longer than 10 seconds.</div>
</div>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="toasts.jsx"></script>
<script type="text/babel" src="adapter-pairing.jsx"></script>
<script type="text/babel" src="screens-lib.jsx"></script>
<script type="text/babel" src="screens-onboarding.jsx"></script>
<script type="text/babel" src="screens-settings.jsx"></script>
<script type="text/babel" src="screens-vehicle.jsx"></script>
<script type="text/babel" src="screens-dash.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
